name: comment on every commit

on: 
  push:
    branches: 
      - '**'

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    setps:
      - name: Post commit comment
      - uses: actions/github-script@v7
        with: 
        script: |
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `
              Commit pushed by **${context.actor}** on branch \`${context.ref.replace('refs/heads/', '')}\`
              
              - SHA: \`${context.sha.substring(0, 7)}\`
              - Timestamp: ${new Date().toUTCString()}
              `,
            })